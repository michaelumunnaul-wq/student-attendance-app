name: student_attendance_app
description: A structured Flutter app for student attendance tracking with authentication, course management, and export features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  pdf: ^3.10.7
  path_provider: ^2.1.1
  share_plus: ^12.0.1
  csv: ^7.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
